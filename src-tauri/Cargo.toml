[package]
name = "dbound"
version = "0.2.0"
description = "dBound – desktop loudness sentinel"
authors = ["dBound"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "dbound_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-window-state = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
winreg = "0.55"
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
